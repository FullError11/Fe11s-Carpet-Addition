import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

/*
 * Ryan'sRenderingKit（RRK）内置依赖的 vendor 处理。
 *
 * 以 git 子模块将 RRK 的 MultiVersion-ServerSide 引入源码。
 * 本脚本负责：
 *   1. 把子模块产物组装成本地 Maven 仓；
 *   2. 通过 Loom 的 include 以 嵌套 jar 打进 FeCA 的 jar；
 *   3. buildRrk 任务用于（重新）构建子模块产物。
 *
 * 注意：
 *   1. Loom 在配置阶段就会解析 mainRuntimeDependencyResolve，所以产物必须在那之前就绪；
 *	 2. 子模块构建使用独立的 project cache 目录，但复用共享的 GRADLE_USER_HOME，避免重复下载整套 MC 与 Loom 工具链。
 */

ext {
	rrkSubmoduleDir = file("vendor/ryansrenderingkit")
	rrkArtifactJar = new File(rrkSubmoduleDir, "build/libs/${rrk_mod_version}/${rrk_mod_id}-${rrk_version}.jar")
	// 刻意放在 build/ 之外：clean 会删掉 build/，而 Loom 在配置阶段就要解析这个仓库
	rrkLocalRepoDir = layout.projectDirectory.dir(".gradle/rrk-maven").asFile
	rrkTargetTask = String.valueOf(":") + rrk_mc_version + ":buildAndCollect"
}

repositories {
	maven {
		url = uri(rrkLocalRepoDir)
	}
}

def execOps = services.get(ExecOperations)



/// 子模块未初始化时给出可操作的报错
def requireSubmodule = {
	if (!rrkSubmoduleDir.isDirectory() || !new File(rrkSubmoduleDir, "settings.gradle.kts").exists()) {
		throw new GradleException('未找到 RRK 子模块 ' + rrkSubmoduleDir
			+ '\n请先执行: git submodule update --init --recursive')
	}
}

/// 调用子模块自己的 gradlew 构建 RRK 26.2 产物
def buildRrkArtifact = {
	requireSubmodule()

	def wrapper = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "gradlew.bat" : "gradlew"
	def command = [new File(rrkSubmoduleDir, wrapper).absolutePath]
	command += ["-p", rrkSubmoduleDir.absolutePath]
	// 独立 project cache，避免与 FeCA 的构建互相干扰
	command += ["--project-cache-dir", new File(rrkSubmoduleDir, ".gradle/nested-build").absolutePath]
	command += ["--console=plain", rrkTargetTask]

	logger.lifecycle("构建 RRK 内置依赖 " + rrkTargetTask + " ...")
	execOps.exec { commandLine command }

	if (!rrkArtifactJar.exists()) {
		throw new GradleException('RRK 构建结束但没有预期产物: ' + rrkArtifactJar
			+ '\n请检查 vendor/ryansrenderingkit 的构建日志。')
	}
}

/// 把 RRK 产物组装成本地 Maven 仓
/// 写一个合法的占位 jar：只含 fabric.mod.json，供 buildRrk 期间的依赖解析使用
def writePlaceholderJar = { File target ->
	target.parentFile.mkdirs()
	def manifest = '{"schemaVersion":1,"id":"' + rrk_mod_id + '","version":"' + rrk_version
	manifest += '","name":"Ryan\'s Server Rendering Kit","environment":"*",'
	manifest += '"depends":{"minecraft":"*"}}'
	def entry = new ZipEntry("fabric.mod.json")
	target.withOutputStream { out ->
		def zip = new ZipOutputStream(out)
		zip.putNextEntry(entry)
		zip.write(manifest.getBytes("UTF-8"))
		zip.closeEntry()
		zip.finish()
	}
}

/// @param jar 要发布的 jar；为 null 时发布一个空占位（仅用于 buildRrk 期间的依赖解析）
def stageRrkRepo = { File jar ->
	requireSubmodule()

	def target = rrkLocalRepoDir.toPath()
		.resolve(rrk_group.replace('.', '/'))
		.resolve(rrk_mod_id)
		.resolve(rrk_version)
		.toFile()
	target.mkdirs()

	def jarTarget = new File(target, "${rrk_mod_id}-${rrk_version}.jar")
	if (jar == null) {
		// 占位：Loom 在配置阶段会解压并读取该 jar，所以必须是合法的 zip 且带 fabric.mod.json
		if (!jarTarget.exists() || jarTarget.length() == 0) {
			writePlaceholderJar(jarTarget)
		}
	} else if (!jarTarget.exists() || jarTarget.length() != jar.length()) {
		Files.copy(jar.toPath(), jarTarget.toPath(), StandardCopyOption.REPLACE_EXISTING)
	}

	def pom = new StringBuilder()
	pom.append('<?xml version="1.0" encoding="UTF-8"?>\n')
	pom.append('<project xmlns="http://maven.apache.org/POM/4.0.0">\n')
	pom.append('  <modelVersion>4.0.0</modelVersion>\n')
	pom.append("  <groupId>${rrk_group}</groupId>\n")
	pom.append("  <artifactId>${rrk_mod_id}</artifactId>\n")
	pom.append("  <version>${rrk_version}</version>\n")
	pom.append('  <name>Ryans Server Rendering Kit</name>\n')
	pom.append('  <description>Server-side Display entity rendering library,')
	pom.append(' built from vendor/ryansrenderingkit (MultiVersion-ServerSide).</description>\n')
	pom.append('  <url>https://github.com/hotpad100c/ryansrenderingkit</url>\n')
	pom.append('  <licenses>\n    <license>\n      <name>MIT License</name>\n')
	pom.append('      <url>https://opensource.org/licenses/MIT</url>\n')
	pom.append('    </license>\n  </licenses>\n</project>\n')
	new File(target, "${rrk_mod_id}-${rrk_version}.pom").text = pom.toString()
}

/// 产物缺失时的可操作报错
def requireRrkArtifact = {
	if (rrkArtifactJar.exists()) return
	requireSubmodule()
	throw new GradleException('缺少 RRK 构建产物: ' + rrkArtifactJar
		+ '\nRRK 是 FeCA 的内置依赖，请重试 ./gradlew buildRrk')
}



// Loom 在配置阶段就会解析 mainRuntimeDependencyResolve，
// 产物必须在此之前就绪，所以缺产物时只能当场构建，无法做成任务级前置依赖。
def runningBuildRrk = gradle.startParameter.taskNames.any { it == "buildRrk" || it.endsWith(":buildRrk") }
def runningClean = gradle.startParameter.taskNames.any { it == "clean" || it.endsWith(":clean") }

if (rrkArtifactJar.exists()) {
	stageRrkRepo(rrkArtifactJar)
} else if (runningBuildRrk) {
	// buildRrk 自己负责构建；先占位让依赖解析过得去
	stageRrkRepo(null)
} else if (runningClean) {
	// clean 不碰子模块产物，这里也不应触发一次构建
	stageRrkRepo(null)
} else {
	// 其余情况：自动构建内置依赖
	requireSubmodule()
	buildRrkArtifact()
	stageRrkRepo(rrkArtifactJar)
}

/* ============================== 任务 ============================== */

/// 构建 RRK 产物（首次构建、升级子模块后、或怀疑产物过期时使用）
tasks.register("buildRrk") {
	group = "build"
	description = "构建 vendor/ryansrenderingkit 子模块（RRK 内置依赖）的 26.2 产物"
	doLast {
		if (rrkArtifactJar.exists()) {
			rrkArtifactJar.delete()
		}
		buildRrkArtifact()
		stageRrkRepo(rrkArtifactJar)
	}
}

/// 从现有产物重建本地 Maven 仓
tasks.register("rrkLocalRepo") {
	group = "build"
	description = "从 vendor/ryansrenderingkit 的构建产物重建本地 Maven 仓"
	doLast { stageRrkRepo(rrkArtifactJar) }
}

// 真正需要 RRK 的任务开始前兜底确认产物存在（正常情况下配置阶段已自动构建）
tasks.matching { it.name in ["compileJava", "compileClientJava", "compileTestJava", "compileGametestJava"] }
	.configureEach { it.doFirst { requireRrkArtifact() } }

/* ============================== 依赖 ============================== */

dependencies {
	// include 让 Loom 把 RRK 以嵌套 jar 打进来，玩家无需单独安装
	implementation "${rrk_group}:${rrk_mod_id}:${rrk_version}"
	include "${rrk_group}:${rrk_mod_id}:${rrk_version}"
}
