import java.nio.file.Files
import java.nio.file.StandardCopyOption

/*
 * 内置依赖 Ryan'sRenderingKit（RRK）的接入。
 *
 * 产物以 jar 形式提交在 libs/，日常构建只做两件事：
 *   1. 把 libs/ 的 jar 组装成本地 Maven 仓（Loom 的 include 只认带 pom 的模块坐标，
 *      直接 include files(...) 会报 "not a module component"）；
 *   2. 通过 include 以嵌套 jar 打进 FeCA。
 *
 * 重新产出 jar 用 buildVendorLibs 任务（见 gradle/vendor-build.gradle）。
 */

ext {
	rrkVendorName = "rrk"
	rrkGroup = "ml.mypals"
	rrkModId = "ryansserverrenderingkit"
	// 刻意放在 build/ 之外：clean 会删掉 build/，而 Loom 在配置阶段就要解析这个仓库
	rrkLocalRepoDir = layout.projectDirectory.dir(".gradle/rrk-maven").asFile
	rrkSourceJar = layout.projectDirectory.file("libs/${rrkModId}-${rrk_version}.jar").asFile
}

repositories {
	maven {
		url = uri(rrkLocalRepoDir)
	}
}

/// 把 libs/ 的 RRK jar 组装成本地 Maven 仓
///
/// @apiNote Loom 在配置阶段就会解析 mainRuntimeDependencyResolve，
/// 所以这里必须同步完成而不是做成任务；
/// 操作只是复制一个 190KB 的 jar 加写一个 pom，开销可忽略。
def stageRrkRepo = {
	if (!rrkSourceJar.exists()) {
		throw new GradleException("缺少内置依赖产物: ${rrkSourceJar}"
			+ "\n请执行 ./gradlew buildVendorLibs -Pvendor=${rrkVendorName} 重新生成。")
	}

	def target = rrkLocalRepoDir.toPath()
		.resolve(rrkGroup.replace('.', '/'))
		.resolve(rrkModId)
		.resolve(rrk_version)
		.toFile()
	target.mkdirs()

	def jarTarget = new File(target, "${rrkModId}-${rrk_version}.jar")
	if (!jarTarget.exists() || jarTarget.length() != rrkSourceJar.length()) {
		Files.copy(rrkSourceJar.toPath(), jarTarget.toPath(), StandardCopyOption.REPLACE_EXISTING)
	}

	def pom = new StringBuilder()
	pom.append('<?xml version="1.0" encoding="UTF-8"?>\n')
	pom.append('<project xmlns="http://maven.apache.org/POM/4.0.0">\n')
	pom.append('  <modelVersion>4.0.0</modelVersion>\n')
	pom.append("  <groupId>${rrkGroup}</groupId>\n")
	pom.append("  <artifactId>${rrkModId}</artifactId>\n")
	pom.append("  <version>${rrk_version}</version>\n")
	pom.append('  <name>Ryans Server Rendering Kit</name>\n')
	pom.append('  <description>Server-side Display entity rendering library (MIT).</description>\n')
	pom.append('  <url>https://github.com/hotpad100c/ryansrenderingkit</url>\n')
	pom.append('  <licenses>\n    <license>\n      <name>MIT License</name>\n')
	pom.append('      <url>https://opensource.org/licenses/MIT</url>\n')
	pom.append('    </license>\n  </licenses>\n</project>\n')
	new File(target, "${rrkModId}-${rrk_version}.pom").text = pom.toString()
}

stageRrkRepo()

dependencies {
	// include 让 Loom 把它以嵌套 jar 打进来，玩家无需单独安装 RRK
	implementation "${rrkGroup}:${rrkModId}:${rrk_version}"
	include "${rrkGroup}:${rrkModId}:${rrk_version}"
}
