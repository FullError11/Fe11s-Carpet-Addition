plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url 'https://masa.dy.fi/maven'
	}
	maven {
		url 'https://api.modrinth.com/maven'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"feca" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/feca.classtweaker")
	log4jConfigs.from "log4j-dev.xml"
}

// L2：Fabric GameTest。loom 自动创建测试源集（src/gametest）+ `runGameTest` 任务，
// 测试在真实专用服务器世界里跑，覆盖需要 ItemStack / 世界 / 玩家交互的规则实现。
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "feca-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
		clearRunDirectory = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Carpet Mod
	implementation "carpet:fabric-carpet:${project.carpet_version}"
	include "carpet:fabric-carpet:${project.carpet_version}"

	// Litematica / MaLiLib（仅客户端，软依赖）
	clientCompileOnly "maven.modrinth:litematica:${project.litematica_version}"
	clientCompileOnly "maven.modrinth:malilib:${project.malilib_version}"

	// 测试：JUnit 5 (Jupiter)。测试代码分两层：
	// - src/test/java  : 通用（服务端）逻辑与组件测试，直接使用 Minecraft 类，需先调用 feca.test.support.GameBootstrap
	// - src/clientTest/java : 客户端专用代码（渲染/客户端网络），由 loom 的 splitEnvironmentSourceSets 生成
	//
	// fabric-loader-junit：在测试 JVM 里启动 Knot/FabricLoader，
	// 这样 FeCA、CommandObserverFreezeAreas 等「构造期依赖 FabricLoader」的类也能在单元测试中初始化
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

tasks.named('test') {
	useJUnitPlatform()
	// 注册表初始化会读取版本信息，固定工作目录避免工具链路径干扰
	systemProperty "feca.test", "true"
	// 测试工作目录放到 build/ 下（该目录必然存在），避免 Minecraft 的日志落进仓库根目录
	workingDir = layout.buildDirectory.get().asFile
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
